[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-filler"
version = "0.1.0"
description = "Coordinate-based static PDF template filler w/ Groq vision & FastAPI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PDF Filler Maintainers" }]
keywords = ["pdf", "schengen", "form", "filler", "pymupdf", "groq", "vision", "fastapi"]
classifiers = [ ... ]  # unchanged

dependencies = [
    "pymupdf>=1.24",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "groq",
    "python-dotenv",
    "fastapi[standard]",
    "uvicorn[standard]",
]

[project.optional-dependencies]
api = ["fastapi[standard]", "uvicorn[standard]"]
openai = ["openai>=1.0"]

[project.scripts]
pdf-filler = "pdf_filler.cli:app"
pdf-filler-api = "api.main:app"

# ... rest unchanged

